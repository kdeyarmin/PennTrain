name: DHS source freshness

# Two different things can turn this red, and the issue it opens now says which: a PA.gov document
# moved or changed content-type, or the 45-day human re-read of those documents is overdue. The old
# title ("check failed") was read as the first when it was usually the second. The failing lines
# themselves go into the issue body, so the cause is legible without opening the run. BACKLOG K10.
#
# The clock also warns before it fails now: `check-dhs-sources.mjs` prints a WARN line inside the
# last seven days, which on a weekly cadence guarantees at least one passing run carries the notice.
# The issue closes itself on the next green run (BACKLOG K1).

on:
  schedule:
    - cron: "17 13 * * 1"
  workflow_dispatch:

# Read-only by default; the job below adds `issues: write` for its reporting steps alone.
permissions:
  contents: read

# A `workflow_dispatch` fired while the weekly run is in flight would otherwise race it through
# the "does an open issue already exist?" read, and both would create one. Queue instead of
# cancelling: a run that is already probing pa.gov should finish and report.
concurrency:
  group: dhs-source-freshness
  cancel-in-progress: false

env:
  DHS_TITLE: "[dhs] PA DHS sources: a link failed or the human review is overdue"

jobs:
  official-source-health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Verify official PA DHS links and human-review freshness
        id: check
        shell: bash
        run: |
          # `pipefail` so `tee` cannot mask the checker's exit status -- `steps.check.outcome`
          # below is what decides whether an issue is opened.
          set -o pipefail
          node scripts/check-dhs-sources.mjs 2>&1 | tee /tmp/dhs-source-check.txt

      # The checker writes its report -- one `OK <status> <url>` line per source, `FAIL <url>: …`
      # for anything unreachable, `WARN …` when a review deadline is approaching, and both
      # verification ages -- to stdout. That report is what someone opening a run actually needs,
      # so it goes on the run summary page. On a GREEN run it is where the WARN line surfaces.
      - name: Publish source-check report to the run summary
        if: always()
        shell: bash
        run: |
          {
            echo "## PA DHS source freshness"
            echo
            echo '```'
            cat /tmp/dhs-source-check.txt 2>/dev/null || echo "(the check produced no output — it failed before running)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Lift the FAIL lines out of the report so the issue body leads with the actual cause. A dead
      # PA.gov link and an overdue human re-read need completely different work, and reading
      # "check failed" as the former when it was the latter cost a week on run 7.
      #
      # The heredoc delimiter is randomised because these lines contain remote content (URLs and
      # HTTP errors from pa.gov); a fixed delimiter appearing inside one of them would let it
      # forge further step outputs.
      - name: Collect the failing lines for the issue body
        id: failures
        if: ${{ failure() && steps.check.outcome == 'failure' }}
        shell: bash
        run: |
          # Written as a plain assignment rather than a `grep | sed || echo` pipeline. GitHub does
          # run `shell: bash` steps with `-o pipefail`, so the pipeline form worked -- but it works
          # only because of a default two layers away from this file, and a reviewer reading it
          # cannot tell whether an empty `lines` output means "no failures" or "the fallback never
          # fired". This form does not depend on the flag at all. (Codex read it the other way on
          # PR #502; the premise was wrong, the fragility it points at was not.)
          failing="$(grep -E '^FAIL ' /tmp/dhs-source-check.txt 2>/dev/null || true)"
          if [ -z "${failing}" ]; then
            failing="    (the check produced no FAIL line — it failed before reaching one, so read the run summary)"
          else
            failing="$(printf '%s\n' "${failing}" | sed 's/^/    /')"
          fi
          delimiter="FAILLINES_$(head -c 16 /dev/urandom | od -An -tx1 | tr -d ' \n')"
          {
            echo "lines<<${delimiter}"
            printf '%s\n' "${failing}"
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"

      # BOTH halves are load-bearing, and each one alone is a different bug.
      #
      # `failure()` alone was the original: true after ANY earlier failed step, so a checkout or
      # setup-node hiccup opened an issue about PA.gov sources while every one of them was fine. A
      # standing compliance alert bumped by infrastructure noise is one people stop believing.
      #
      # `steps.check.outcome == 'failure'` alone -- the first attempt at that fix -- never runs at
      # all. GitHub wraps any `if:` with no status-check function in an implicit `success()`, so
      # once the check step fails the condition is `success() && …`, which is false, and the step is
      # skipped in exactly the case it exists for. That silently removed the workflow's only
      # persistent alert rather than narrowing it.
      #
      # Together they mean what was intended: run despite the failed step, but only when the failure
      # was this check's own. If checkout fails, `steps.check.outcome` is `skipped`, not `failure`.
      - name: Report a failed source check
        if: ${{ failure() && steps.check.outcome == 'failure' }}
        uses: ./.github/actions/reconcile-issue
        with:
          state: open
          title: ${{ env.DHS_TITLE }}
          labels: dhs-source-stale
          bump-comment: "Still failing:\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body: |
            The weekly DHS source freshness job failed. What failed, verbatim from the check:

            ```
            ${{ steps.failures.outputs.lines }}
            ```

            Those lines say which of the two very different causes this is:

            - **`… : HTTP …` or `… expected PDF but received …`** — a PA.gov document moved, was
              withdrawn, or changed content-type. Find its new location, update
              `artifacts/caremetric-carebase/src/lib/dhsFormsLibrary.ts`, and check whether the
              document's *content* changed as well as its URL.
            - **`Human source review is stale: …`** — every link is fine; the 45-day human re-read
              is overdue. Run `node scripts/snapshot-dhs-sources.mjs` to see which documents
              actually changed since the last digest, read those, then re-stamp
              `DHS_FORMS_LAST_VERIFIED`. An unchanged digest is not an attestation.

            - Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - Full per-source report: the run summary on that page lists every URL checked.
            - Script: `scripts/check-dhs-sources.mjs`

            Opened automatically by `dhs-source-freshness.yml`. It closes itself once a later run
            finds every source reachable and both review stamps current.

      - name: Retire the alert once sources and stamps are current
        if: ${{ success() && steps.check.outcome == 'success' }}
        uses: ./.github/actions/reconcile-issue
        with:
          state: closed
          title: ${{ env.DHS_TITLE }}
          close-comment: "Every PA DHS source resolved and both review stamps are current on this run:\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

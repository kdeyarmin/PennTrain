name: Secret scan (full history)

# The per-push secret scan in ci.yml does NOT scan this repository's history, despite its step
# being named as though it did. Verified against the pinned action's source at
# gitleaks/gitleaks-action@e0c47f4f (v3.0.0), `src/index.js`:
#
#   push              -> scanInfo = { baseRef: commits[0].id, headRef: commits[last].id }
#                        and gitleaks runs with `--log-opts=--no-merges --first-parent
#                        <baseRef>^..<headRef>` -- the commits in that push, nothing else.
#   pull_request      -> ScanPullRequest(...), the commits in that pull request.
#   workflow_dispatch -> scanInfo = { gitleaksPath } with no baseRef/headRef at all, which is
#   schedule             what makes gitleaks scan the whole history.
#
# So the only two events that scan history are the two nothing was firing. That gap is not
# hypothetical for this repository: `.gitleaksignore` carries fingerprints for secrets found in
# specific historical commits, which is evidence that a history-wide scan has been run here at
# some point -- by hand, not by CI, and not since.
#
# The per-push scan is still the right thing on a push: it is fast and it catches a secret in the
# commit that introduces it, which is the cheapest moment to catch one. This workflow covers what
# that scan structurally cannot -- a secret already in the history, and one whose detection rule
# did not exist when its commit was pushed, since the rules ship with gitleaks and change over
# time. Weekly is enough for something that only changes when the rules or the history change.
# BACKLOG K6.

on:
  schedule:
    - cron: "13 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-history
  cancel-in-progress: false

env:
  SECRET_SCAN_TITLE: "[secrets] Full-history scan found a candidate secret"

jobs:
  scan-history:
    runs-on: ubuntu-latest
    # The per-push job allows 15 for a full clone plus a scan of one push. This one scans every
    # commit, so it gets more -- and it is a weekly job, so the budget costs nothing to grant.
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full clone, and NOT `filter: blob:none`: this scan reads the content of every
          # historical blob, so a partial clone would refetch all of them one at a time instead
          # of once in bulk -- strictly slower, same bytes. (On the per-push job in ci.yml the
          # same reasoning does not apply, because that scan only ever reads one push's commits.)
          fetch-depth: 0

      - name: Scan the full repository history for committed secrets
        id: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Both halves are load-bearing, for the reason spelled out at length in the other two
      # scheduled workflows: `failure()` alone fires on a checkout problem and would assert a
      # leaked secret when nothing was scanned, and the outcome test alone never runs, because
      # GitHub wraps an `if:` with no status-check function in an implicit `success()`.
      - name: Report a candidate secret
        if: ${{ failure() && steps.gitleaks.outcome == 'failure' }}
        uses: ./.github/actions/reconcile-issue
        with:
          state: open
          title: ${{ env.SECRET_SCAN_TITLE }}
          bump-comment: "Still failing:\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body: |
            The weekly full-history secret scan failed, which means gitleaks matched something in
            this repository's git history.

            - Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - The run log names each finding's rule, file, commit and line.

            **Treat it as real until it is shown not to be.** Rotate first and triage second: a
            secret in git history is readable by anyone who can clone the repository, and rewriting
            history does not un-disclose it.

            If the match is genuinely not a secret — a rule-pack identifier, a test fixture, a
            dotted constant with high entropy — record it deliberately rather than muting the job:

            - a value that recurs in current files belongs in `.gitleaks.toml` as a scoped
              allowlist (`regexTarget`, `regexes` and `paths` together, never a bare rule disable);
            - a one-off in an already-immutable historical commit belongs in `.gitleaksignore` as a
              `<commit>:<path>:<rule>:<line>` fingerprint, with a comment saying why it is not a
              secret.

            Both files already carry worked examples of each. Opened automatically by
            `secret-scan-history.yml`; it closes itself once a later scan is clean.

      - name: Retire the alert once the history is clean
        if: ${{ success() && steps.gitleaks.outcome == 'success' }}
        uses: ./.github/actions/reconcile-issue
        with:
          state: closed
          title: ${{ env.SECRET_SCAN_TITLE }}
          close-comment: "The full-history scan is clean on this run:\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

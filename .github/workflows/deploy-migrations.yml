name: Deploy migrations

# Deploys committed migrations AND edge functions to the production Supabase project -- but
# only after CI has validated the exact commit on main. Root cause this closes (see
# MIGRATION_DEPLOYMENT_AUDIT.md): CI validated the migration chain on a throwaway local stack
# but nothing deployed it to the remote, so migrations merged to main could sit undeployed
# indefinitely. PT-068 extended the same fix to edge functions, which previously deployed
# only by manual CLI invocation (DEPLOYMENT.md) and could likewise sit undeployed.
#
# Why `workflow_run` and not `push`: triggering directly on push to main would let
# `supabase db push` mutate production in parallel with -- and possibly before -- the CI
# `database` job that reapplies and tests the whole migration chain (reset, tests, lint,
# advisors). Instead this runs only after the "CI" workflow finishes successfully on main, and
# checks out exactly the SHA CI validated, so production is never changed ahead of validation.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions), preferably on
# the `production` Environment:
#   SUPABASE_ACCESS_TOKEN  -- a Supabase personal access token (https://supabase.com/dashboard/account/tokens)
#   SUPABASE_DB_PASSWORD   -- the project's database password (Project Settings -> Database)
#
# Required repository variable (Settings -> Secrets and variables -> Actions -> Variables):
#   SUPABASE_PROJECT_ID    -- project ref (fallback hardcoded below if unset, for first migrate)

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Drift checks only — do not push migrations or deploy functions
        type: boolean
        default: false
      force:
        description: Force deploy even if this SHA was already deployed or paths are unchanged
        type: boolean
        default: false

# Workflow-level default is read-only; each job adds exactly what it uses. `issues: write` used to
# sit here, which handed it to `deploy` as well -- the job that checks out code and holds the
# production Supabase credentials, and never touches the issues API.
permissions:
  contents: read

# Never let two deploys run against the database at once; queue them instead of cancelling,
# since cancelling a half-applied `db push` is worse than waiting.
concurrency:
  group: deploy-migrations
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Gate on a *successful* CI run for a PUSH to THIS repository's main, or a manual dispatch that
    # is itself on main. This keeps production changes behind CI validation and prevents deploying
    # an arbitrary ref.
    #
    # The `event` and `head_repository` conditions are load-bearing, not belt-and-braces. The
    # `on.workflow_run.branches: [main]` filter above matches the triggering run's HEAD BRANCH NAME,
    # and CI runs on `pull_request` — including pull requests from forks. A fork PR opened from a
    # branch the contributor happens to have called `main` therefore satisfies that filter, and the
    # checkout below takes `github.event.workflow_run.head_sha`, which for such a run is the FORK's
    # commit. Conclusion alone does not distinguish it: the fork's CI passes on the fork's code.
    # That is a path from "open a PR" to "run `supabase db push` and deploy edge functions against
    # production" on unmerged, unreviewed code. Requiring the triggering run to be a `push` on this
    # repository closes it, because a fork PR is always `pull_request` from another repository.
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    environment: production
    # `actions: read` is load-bearing here and only here: the gate below queries this workflow's
    # own run and artifact history to decide whether this SHA was already deployed.
    permissions:
      contents: read
      actions: read
    outputs:
      skipped: ${{ steps.gate.outputs.skip }}
      reason: ${{ steps.gate.outputs.reason }}
      deploy_sha: ${{ steps.gate.outputs.deploy_sha }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      # Prefer repository/environment variable; fall back to the known prod ref so first
      # deploys keep working before the variable is created.
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID || 'xsqobvvreaovwibxwyvv' }}
      # Always the SHA we check out and deploy — NOT github.sha on workflow_run (which is the
      # tip of main at dispatch time and can lag/lead the validated commit).
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Deploy exactly the commit CI validated; for a manual dispatch, main's tip. Never a
          # caller-selected feature ref, so unmerged migrations cannot reach production.
          # fetch-depth 0 so the path short-circuit can diff against the prior deploy SHA.
          ref: ${{ github.event.workflow_run.head_sha || 'refs/heads/main' }}
          fetch-depth: 0

      - name: Decide whether deploy is needed
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          SHA="${DEPLOY_SHA}"
          RUN_ID="${{ github.run_id }}"
          REPO="${{ github.repository }}"
          STAMP_PREFIX="edge-function-deploy-stamp-"

          echo "Deploy candidate SHA=${SHA} dry_run=${DRY_RUN}"
          echo "deploy_sha=${SHA}" >> "$GITHUB_OUTPUT"

          # Deploy SHAs stamped by one run, newest artifact first, one line each. The stamp
          # artifact name embeds the *validated* DEPLOY_SHA so we never trust the workflow run's
          # REST head_sha (on workflow_run that is tip-of-main at dispatch, which can disagree
          # with the commit we actually checked out).
          #
          # One listing per run answers BOTH gate questions below. They used to be two functions
          # walking the same 50 runs one after the other -- up to 100 sequential REST calls on the
          # critical path of every production deploy, before a single migration is pushed, to read
          # the same 50 responses twice.
          #
          # The status is captured rather than left to `set -e`, for the same reason the run listing
          # below captures its own: an aborted gate is a FAILED PRODUCTION DEPLOY, and this loop
          # makes up to 50 sequential API calls, so it is the most rate-limit-exposed thing here.
          # An earlier version let `set -e` kill the step on a transient 5xx and called that
          # "failing loudly" -- but the two directions are not equally bad. Not knowing the history
          # means deploying (redundant, and `db push` is idempotent); aborting means production does
          # not get its migrations and someone has to notice the issue. Undetermined resolves toward
          # deploying everywhere else in this gate; it does here too.
          # Reports a failed lookup through its EXIT STATUS, not a variable. The caller reads this
          # through `$( )`, which runs the function in a subshell, so anything it assigns is
          # discarded when that subshell exits -- a first attempt set a `STAMP_LOOKUP_FAILED` flag
          # here and the caller never saw it, so an unreadable run still silently counted as "no
          # stamps" and the path short-circuit ran on a history with a hole in it. Status crosses
          # the subshell boundary; assignments do not.
          stamp_shas_for_run() {
            local status=0
            local out
            out=$(
              gh api "repos/${REPO}/actions/runs/$1/artifacts?per_page=100" \
                --jq ".artifacts[] | select(.name | startswith(\"${STAMP_PREFIX}\")) | .name | ltrimstr(\"${STAMP_PREFIX}\")"
            ) || status=$?
            if [ "${status}" -ne 0 ]; then
              echo "::warning::Could not list artifacts for run $1 (gh exit ${status}); treating its deploy history as unknown." >&2
              return 2
            fi
            printf '%s' "${out}"
          }

          # Dry-run always proceeds (operators want drift verification on demand).
          if [ "${DRY_RUN}" = "true" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "reason=dry-run" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Manual force bypasses same-SHA and path short-circuits.
          if [ "${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force == 'true' }}" = "true" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "reason=force" >> "$GITHUB_OUTPUT"
            echo "Force deploy requested"
            exit 0
          fi

          # Candidate runs to compare against: recent successful deploy runs, newest first. Do NOT
          # filter by run head_sha -- that is unreliable under workflow_run.
          #
          # An empty list here is the safe direction (no prior deploy known → nothing to skip
          # against → deploy, and `db push` is idempotent), so a transient `gh` failure must not
          # abort the step the way `$( )` under `set -e` would -- that would turn an API blip into
          # a failed production deploy and a deploy-failure issue. It must not be SILENT either,
          # so the status is captured and warned on rather than discarded.
          RECENT_STATUS=0
          RECENT_IDS=$(
            gh api "repos/${REPO}/actions/workflows/deploy-migrations.yml/runs?status=completed&per_page=50" \
              --jq ".workflow_runs[] | select(.conclusion==\"success\" and .id != ${RUN_ID}) | .id"
          ) || RECENT_STATUS=$?
          if [ "${RECENT_STATUS}" -ne 0 ]; then
            echo "::warning::Could not list recent deploy runs (gh exit ${RECENT_STATUS}); proceeding with a full deploy rather than short-circuiting on an unknown history."
            RECENT_IDS=""
          fi
          RECENT=()
          if [ -n "${RECENT_IDS}" ]; then
            mapfile -t RECENT <<< "${RECENT_IDS}"
          fi

          # Two questions, one walk over those runs:
          #   1) Is this SHA already *really* deployed (a stamp artifact named with it)? → no-op.
          #      Path-skip successes for this SHA do not count -- they never touched production.
          #      Every candidate is scanned, not just the newest: an older run may hold this SHA's
          #      stamp after a rollback or a re-run.
          #   2) Which SHA was deployed last? → PREV_SHA, the stamp on the newest run that has one,
          #      used by the path short-circuit below.
          PREV_SHA=""
          STAMP_LOOKUP_FAILED=0
          for rid in "${RECENT[@]+"${RECENT[@]}"}"; do
            LOOKUP_STATUS=0
            STAMP_SHAS=$(stamp_shas_for_run "$rid") || LOOKUP_STATUS=$?
            if [ "${LOOKUP_STATUS}" -ne 0 ]; then
              STAMP_LOOKUP_FAILED=1
              continue
            fi
            [ -n "${STAMP_SHAS}" ] || continue

            if [ -z "${PREV_SHA}" ]; then
              PREV_SHA=$(printf '%s\n' "${STAMP_SHAS}" | head -n 1)
              echo "Last real deploy: run ${rid} sha ${PREV_SHA}"
            fi

            if printf '%s\n' "${STAMP_SHAS}" | grep -qxF "${SHA}"; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "reason=same-sha-already-deployed" >> "$GITHUB_OUTPUT"
              echo "SHA ${SHA} already deployed in run ${rid} (stamp artifact present)"
              exit 0
            fi
          done

          # A lookup that failed above leaves a hole in the history, and the hole is not harmless:
          # the newest run carrying a stamp may be one this loop could not read, in which case
          # PREV_SHA names an OLDER deploy and diffing against it can find no Supabase changes and
          # skip a deploy that was actually needed. A missed same-SHA stamp only costs a redundant
          # idempotent deploy, but a wrong baseline costs a real one, so an incomplete scan
          # disqualifies the path short-circuit entirely.
          if [ "${STAMP_LOOKUP_FAILED}" -ne 0 ]; then
            echo "::warning::Deploy history is incomplete (at least one artifact lookup failed); skipping the path short-circuit and deploying."
          elif [ -n "${PREV_SHA}" ] && [ "${PREV_SHA}" != "${SHA}" ]; then
            # `|| true` used to swallow the exit status here, which made an ERRORED diff
            # indistinguishable from a diff that legitimately found nothing -- and the branch below
            # reads "nothing" as "skip the deploy". So an unfetchable PREV_SHA (a force-push, a
            # pruned object, a shallow fetch) silently skipped a production deploy and reported
            # success. That is precisely the failure this workflow exists to close: its own header
            # says migrations merged to main "could sit undeployed indefinitely". Failing that way
            # is worse than deploying, because `supabase db push` skips migrations already applied,
            # so proceeding when we cannot tell is idempotent while skipping is not recoverable
            # without someone noticing.
            DIFF_STATUS=0
            CHANGED=$(
              git diff --name-only "${PREV_SHA}" "${SHA}" -- \
                supabase/migrations \
                supabase/functions \
                supabase/config.toml \
                deno.lock \
                scripts/check-migration-drift.mjs \
                scripts/check-edge-function-drift.mjs \
                scripts/stamp-edge-function-deploy.mjs \
                .github/workflows/deploy-migrations.yml
            ) || DIFF_STATUS=$?
            if [ "${DIFF_STATUS}" -ne 0 ]; then
              echo "::warning::Could not diff ${PREV_SHA}..${SHA} (git exit ${DIFF_STATUS}); deploying rather than skipping on an undetermined path check."
              CHANGED="undetermined"
            fi
            if [ -z "${CHANGED}" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "reason=no-supabase-changes" >> "$GITHUB_OUTPUT"
              echo "No migration/function/config changes since ${PREV_SHA}"
              exit 0
            fi
            echo "Supabase-related changes since ${PREV_SHA}:"
            # shellcheck disable=SC2086
            printf '  %s\n' ${CHANGED}
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "reason=deploy" >> "$GITHUB_OUTPUT"

      - name: Skip remaining steps when not needed
        if: steps.gate.outputs.skip == 'true'
        run: echo "Skipping deploy (${{ steps.gate.outputs.reason }})"

      - uses: ./.github/actions/setup-node-pnpm
        if: steps.gate.outputs.skip != 'true'

      # Pin both the setup action and the CLI version to match the CI database job, so
      # push behavior reproduces what CI validated.
      - uses: ./.github/actions/setup-supabase-cli
        if: steps.gate.outputs.skip != 'true'

      - name: Verify deploy secrets are configured
        if: steps.gate.outputs.skip != 'true'
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD repository/environment secrets must be set before this workflow can deploy. See MIGRATION_DEPLOYMENT_AUDIT.md."
            exit 1
          fi
          if [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "::error::SUPABASE_PROJECT_ID variable is empty."
            exit 1
          fi
          echo "Project ref: $SUPABASE_PROJECT_ID"

      - name: Link Supabase project
        if: steps.gate.outputs.skip != 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      # --include-all backfills any pending migration whose version sorts before one already
      # applied on the remote (the out-of-order situation this project hit); a plain `db push`
      # would refuse it and leave drift, which the verify step below would then flag.
      - name: Push pending migrations
        if: steps.gate.outputs.skip != 'true' && env.DRY_RUN != 'true'
        run: supabase db push --include-all

      - name: Verify no migration drift remains
        if: steps.gate.outputs.skip != 'true'
        run: node scripts/check-migration-drift.mjs

      # Deploy every edge function with its supabase/config.toml settings (verify_jwt et al.)
      # after the database is migrated, so functions never run ahead of the schema they need.
      # Presence drift is re-checked after deploy; a content stamp is archived for operators.
      - name: Deploy edge functions
        if: steps.gate.outputs.skip != 'true' && env.DRY_RUN != 'true'
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID"

      # `supabase functions deploy` only pushes what is in the tree -- it never removes a function
      # whose source was deleted in a PR. That orphan then fails the presence check below, AFTER
      # `db push` has already migrated production: a half-applied deploy whose live function calls
      # schema the migration just dropped. This deletes exactly the slugs recorded in
      # scripts/removed-edge-functions.json, and is idempotent once they are gone.
      - name: Prune edge functions removed from the repository
        if: steps.gate.outputs.skip != 'true'
        run: node scripts/prune-removed-edge-functions.mjs ${{ env.DRY_RUN == 'true' && '' || '--apply' }}

      - name: Verify edge function presence (no pending/orphan slugs)
        if: steps.gate.outputs.skip != 'true'
        run: node scripts/check-edge-function-drift.mjs

      - name: Stamp deployed function content digests
        if: steps.gate.outputs.skip != 'true' && env.DRY_RUN != 'true'
        env:
          # Stamp must record the validated deploy SHA, not workflow_run tip-of-main.
          DEPLOY_SHA: ${{ env.DEPLOY_SHA }}
        run: node scripts/stamp-edge-function-deploy.mjs edge-function-deploy-stamp.json

      - name: Upload edge function deploy stamp
        if: steps.gate.outputs.skip != 'true' && env.DRY_RUN != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Name embeds DEPLOY_SHA so the gate never confuses workflow_run tip-of-main
          # with the commit that was actually deployed.
          name: edge-function-deploy-stamp-${{ env.DEPLOY_SHA }}
          path: edge-function-deploy-stamp.json

  # Survives job timeouts/cancellations of `deploy` (in-job `if: failure()` does not run
  # when the job is cancelled by timeout-minutes) -- hence the check on `needs.deploy.result`
  # rather than a step-level `if: failure()` inside `deploy`.
  #
  # `always()`, deliberately, after a round trip through `!cancelled()` and back.
  #
  # The case against `always()` is real: the `concurrency: deploy-migrations` group queues deploys
  # and GitHub keeps only one run pending, so a third merge landing while a second waits cancels the
  # waiting run, and each of those opens a `[deploy] … failed` issue for a deploy that was
  # superseded rather than broken. `!cancelled()` suppresses exactly that.
  #
  # It also depends on an assumption GitHub does not actually document. The premise is that
  # `timeout-minutes` cancels the JOB while leaving the RUN uncancelled, so `cancelled()` stays
  # false and a timed-out deploy still reports. The expressions reference defines `cancelled()` only
  # as "returns true if the workflow was canceled" and says nothing about job timeouts; a reviewer
  # reading the same page concluded the opposite. Neither reading can be settled from the docs, and
  # the two failure modes are not symmetric:
  #
  #   wrong about supersession -> a spurious issue, deduplicated by the script below, closed in a
  #                               click, and visibly tied to a superseded run
  #   wrong about timeouts     -> a production migration deploy times out and NOTHING says so
  #
  # A compliance product does not trade a guaranteed alert for tidier issues on an unverifiable
  # premise. So this stays `always()` and the noise is handled where it can be described rather than
  # guessed at: the issue body names supersession as the first thing to check when the deploy job
  # was cancelled. If GitHub ever specifies the timeout semantics, this can narrow again.
  notify-failure:
    needs: deploy
    if: ${{ always() && needs.deploy.result != 'success' && needs.deploy.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open issue on deploy failure
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DEPLOY_SHA: ${{ needs.deploy.outputs.deploy_sha || github.event.workflow_run.head_sha || github.sha }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        with:
          script: |
            const short = (process.env.DEPLOY_SHA || 'unknown').slice(0, 7);
            const result = process.env.DEPLOY_RESULT || 'unknown';
            const title = `[deploy] Production migration/function deploy failed (${short})`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            // `cancelled` is the one result with a benign explanation, so say so here rather than
            // suppressing the whole notification on a guess about what produced it. Two things
            // reach this job as `cancelled`: a run superseded in the deploy concurrency queue
            // (harmless -- a later run deploys the same migrations, and `db push` is idempotent)
            // and a deploy that exceeded `timeout-minutes` mid-flight (not harmless at all).
            const cancelledNote = result === 'cancelled'
              ? [
                  '',
                  '**This deploy was cancelled, which has two very different causes — check which one:**',
                  '- *Superseded in the queue.* Another deploy for a newer commit was already waiting.',
                  '  Harmless: the later run deploys these migrations too, and `db push` is idempotent.',
                  '  The run above will show the job never started.',
                  '- *Timed out mid-deploy.* The job hit `timeout-minutes` while running. Production may',
                  '  be part-way through a migration or function deploy — check the run log and the',
                  '  project before re-running.',
                ]
              : [];
            const body = [
              `Deploy workflow ended with \`${result}\` for \`${process.env.DEPLOY_SHA}\`.`,
              '',
              `- Run: ${runUrl}`,
              `- Event: ${context.eventName}`,
              ...cancelledNote,
              '',
              'Opened automatically by `deploy-migrations.yml` (`notify-failure` job). Close after a successful re-run or a manual fix.',
            ].join('\n');

            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 30,
            });
            const existing = open.find((i) => i.title === title || (i.title.includes(short) && i.title.startsWith('[deploy]')));
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Another non-success for this SHA (result=${result}):\n${runUrl}`,
              });
              return;
            }

            try {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['deploy-failure'],
              });
            } catch (err) {
              // Label may not exist yet — create without labels.
              core.warning(`Create with label failed (${err.message}); retrying without labels`);
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }

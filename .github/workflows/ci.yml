name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Path-aware CI:
# - push to main: always full matrix (deploy-migrations.yml waits on a complete validation)
# - pull_request: skip expensive jobs when their inputs did not change
#   (e.g. Edge Function CORS-only PRs run application + secret-scan, not database/e2e)
#
# Branch protection: prefer requiring the aggregate `ci-result` job rather than
# individual matrix jobs, so skipped path-filtered jobs do not block merge.

permissions:
  contents: read

# Cancel superseded PR runs; keep main runs (deploy waits on the successful SHA).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    # Same exposure as planning-registers below, and worse consequences: this job also spends its
    # whole budget on a `fetch-depth: 0` clone, and every other job is gated on its outputs, so a
    # slow clone here does not fail one check -- it takes the run with it.
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      application: ${{ steps.filter.outputs.application }}
      database: ${{ steps.filter.outputs.database }}
      migrations: ${{ steps.filter.outputs.migrations }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Need base..head history for an accurate PR diff.
          #
          # `blob:none` makes that history a partial clone: every commit and tree is fetched (which
          # is all `git diff --name-only` compares -- tree entries, not file contents), and blobs
          # arrive lazily only if something actually reads a file. This repository carries several
          # hundred-kilobyte living registers -- BACKLOG.md alone is ~300 KB and churns constantly
          # -- so historical blobs are the bulk of a full clone here. That matters most in THIS
          # job: it is the run's critical path, every other job is gated on its outputs, and the
          # comment above already records a checkout slow enough to blow the job budget.
          fetch-depth: 0
          filter: blob:none

      - name: Detect changed path groups
        id: filter
        shell: bash
        run: |
          set -euo pipefail

          # Full matrix on main pushes — production deploy depends on complete CI.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "application=true" >> "$GITHUB_OUTPUT"
            echo "database=true" >> "$GITHUB_OUTPUT"
            echo "migrations=true" >> "$GITHUB_OUTPUT"
            echo "Path filter: push event → full matrix"
            exit 0
          fi

          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"

          # Read the diff into a variable rather than `mapfile < <(git diff ...)`: process
          # substitution is covered by neither `set -e` nor `pipefail`, so mapfile swallowed git's
          # exit status entirely. An ERRORED diff -- base object pruned after a force-push, a
          # partial fetch that did not reach BASE, a repository in a bad state -- produced an empty
          # FILES array, which the branch below reads as "nothing changed". Every gated job was
          # then skipped, and `ci-result` counts a skipped job as success: a git error merged the
          # pull request with no validation at all. This is the same trap deploy-migrations.yml
          # already settled for its own path short-circuit, and it settles it the same way -- when
          # the path check cannot be determined, do the expensive safe thing, not the cheap unsafe
          # one.
          DIFF_STATUS=0
          DIFF_OUTPUT=$(git diff --name-only "$BASE"..."$HEAD") || DIFF_STATUS=$?
          if [ "$DIFF_STATUS" -ne 0 ]; then
            echo "::warning::Could not diff ${BASE}...${HEAD} (git exit ${DIFF_STATUS}); running the full matrix rather than skipping every gated job on an undetermined path check."
            {
              echo "application=true"
              echo "database=true"
              echo "migrations=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A single empty line is one empty element to mapfile, not zero, so guard the empty case.
          FILES=()
          if [ -n "$DIFF_OUTPUT" ]; then
            mapfile -t FILES <<< "$DIFF_OUTPUT"
          fi

          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "application=false" >> "$GITHUB_OUTPUT"
            echo "database=false" >> "$GITHUB_OUTPUT"
            echo "migrations=false" >> "$GITHUB_OUTPUT"
            echo "Path filter: empty diff → skip gated jobs"
            exit 0
          fi

          application=false
          database=false
          migrations=false

          matches() {
            local path="$1"
            shift
            local pattern
            for pattern in "$@"; do
              # shellcheck disable=SC2254
              case "$path" in
                $pattern) return 0 ;;
              esac
            done
            return 1
          }

          # application → check:all (typecheck, unit tests, edge-function checks, builds)
          #
          # `supabase/migrations/**` belongs here as well as in DB_PATTERNS: check:all runs
          # check:migration-policies, check:raise-arity, check:date-only-parsing and
          # check:clinical-access-log, which read the migration files directly. Without it a migrations-only PR would skip exactly the static
          # checks written to guard migrations. (check:migration-drift is NOT one of them: check:all
          # runs only its --self-test, and the real drift check belongs to deploy-migrations.yml,
          # which needs remote credentials.)
          # deno.lock pins the Edge Function dependency graph that check:edge-functions resolves.
          # `.github/workflows/*` and `.github/actions/*` cover workflow and composite-action
          # changes so path-filter edits re-validate. Deliberately NOT a bare `.github/*`: that
          # also matched `.github/dependabot.yml` -- and would match any issue template or
          # CODEOWNERS file added later -- so editing one booted the whole 45-minute `database`
          # job, a local Supabase stack, 581 migrations and a Playwright suite, to validate a file
          # no job reads.
          APP_PATTERNS=(
            "artifacts/*"
            "scripts/*"
            "package.json"
            "pnpm-lock.yaml"
            "pnpm-workspace.yaml"
            ".node-version"
            ".npmrc"
            "supabase/functions/*"
            "supabase/migrations/*"
            "supabase/config.toml"
            "deno.lock"
            ".github/workflows/*"
            ".github/actions/*"
            # Deploy and toolchain config that nothing else in this list covers. A PR touching only
            # these set application=false AND database=false, every gated job was skipped, and
            # ci-result aggregates a skipped job as success -- so it merged with no validation at
            # all. railway.json/railpack.json are the start command and build plan that
            # check:startup exercises; tsconfig.base.json is the base config every workspace
            # extends, so it moves typecheck everywhere; .nvmrc is the Node version, and its
            # sibling .node-version was already listed.
            "railway.json"
            "railpack.json"
            "tsconfig.base.json"
            ".nvmrc"
          )

          # database → local Supabase stack, advisors, types drift, Playwright e2e
          # Dependency manifests are included because the e2e run builds CareBase from them.
          DB_PATTERNS=(
            "supabase/migrations/*"
            "supabase/tests/*"
            "supabase/seed*"
            "supabase/config.toml"
            "artifacts/caremetric-carebase/*"
            "package.json"
            "pnpm-lock.yaml"
            "pnpm-workspace.yaml"
            "scripts/check-database*"
            "scripts/check-migration*"
            "scripts/check-raise-arity*"
            "scripts/check-journey-coverage*"
            "scripts/seed-course-video-placeholders*"
            ".github/workflows/*"
            ".github/actions/*"
            # The e2e run builds CareBase, and every workspace tsconfig extends this one.
            "tsconfig.base.json"
          )

          # migration-immutability → only when migration files or its checker/allowlist change
          MIG_PATTERNS=(
            "supabase/migrations/*"
            "scripts/migration-content-allowlist.json"
            "scripts/check-migration-immutability.mjs"
          )

          for f in "${FILES[@]}"; do
            if matches "$f" "${APP_PATTERNS[@]}"; then application=true; fi
            if matches "$f" "${DB_PATTERNS[@]}"; then database=true; fi
            if matches "$f" "${MIG_PATTERNS[@]}"; then migrations=true; fi
          done

          echo "application=$application" >> "$GITHUB_OUTPUT"
          echo "database=$database" >> "$GITHUB_OUTPUT"
          echo "migrations=$migrations" >> "$GITHUB_OUTPUT"

          echo "Changed files (${#FILES[@]}):"
          printf '  %s\n' "${FILES[@]}"
          echo "Path filter → application=$application database=$database migrations=$migrations"

  application:
    needs: changes
    if: needs.changes.outputs.application == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # No `actions: read`: this job never reads the Actions API (that is deploy-migrations.yml's
    # stamp gate). Caching and artifact upload authenticate with the runtime token, not GITHUB_TOKEN.
    permissions:
      contents: read
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_ANON_KEY: test-anon-key
      VITE_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The dependency gate reads the base ref's pnpm-lock.yaml to tell a newly-introduced
          # advisory from one the base already carries, so it needs the base branch, not just
          # this PR's head. Same reason migration-immutability checks out with full history.
          #
          # Partial clone is safe here: the gate reaches into history through `git ls-tree` (trees
          # only) and a handful of `git show <base>:<path>` reads, each of which lazily fetches
          # just that blob. A working tree still materializes normally.
          fetch-depth: 0
          filter: blob:none

      - uses: ./.github/actions/setup-node-pnpm

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.5.6

      - name: Cache Deno module graph
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/deno
          key: deno-${{ runner.os }}-${{ hashFiles('deno.lock') }}
          restore-keys: |
            deno-${{ runner.os }}-

      # --base is what stops a newly-published advisory failing every open branch at once.
      # On a pull request the gate compares this branch's dependency set against the base
      # branch's and only fails on advisories THIS change introduced; anything the base
      # already carries is reported loudly and left to the base branch's own run. On a push
      # to main there is no base, the gate runs strict, and main goes red for its own
      # pre-existing advisories -- which is the branch that should. See the header of
      # scripts/check-dependencies.mjs.
      - name: Dependency vulnerability gate (self-test)
        run: node scripts/check-dependencies.mjs --self-test

      - name: Dependency vulnerability gate
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            node scripts/check-dependencies.mjs --base "origin/${GITHUB_BASE_REF}"
          else
            node scripts/check-dependencies.mjs
          fi

      - name: Application release gate
        run: pnpm run check:all

      # BACKLOG J74. `check:all` builds, and the build regenerates
      # `public/CareMetric-CareBase-User-Manual.pdf` from the help-centre source. The committed copy
      # had fallen behind it -- it still sold the exclusion screening that `20260906020000` removed
      # -- so every `pnpm build` dirtied a contributor's worktree with a file they had not edited,
      # nothing failed, and the stale manual kept shipping. The output is reproducible: pdf-lib
      # names PDF resources from `SimpleRNG.withSeed(1)`, a fixed seed, so identical input gives
      # identical bytes on any machine. That is what makes this checkable rather than noisy.
      #
      # Scoped to what the build actually generates into the tracked tree. `deno.lock` is
      # deliberately excluded: `check:edge-functions` runs Deno, which rewrites the lockfile as a
      # side effect of resolving modules, and that churn is not a stale artifact -- folding it in
      # would make this step fail on every run and teach everyone to ignore it, which is the exact
      # failure being fixed here.
      - name: Fail if the release gate regenerated a committed file
        run: |
          generated='artifacts/caremetric-carebase/public/CareMetric-CareBase-User-Manual.pdf'
          if ! git diff --exit-code --stat -- $generated; then
            echo "::error::The build regenerated $generated. Run 'pnpm --filter @workspace/scripts run generate:manual' and commit the result."
            exit 1
          fi

      # Push-only. On a pull request `github.sha` is the ephemeral merge commit, which ceases to
      # exist once the branch merges -- so a per-PR copy is not a record of anything that will
      # still be identifiable later, and nothing in this repository (no workflow, no deploy path,
      # no runbook) ever downloads one. What is left is the storage: a full `dist/public` bundle
      # per PR push, held 14 days. Keeping it on main preserves the provenance record for commits
      # that actually shipped.
      - name: Publish immutable application artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: caremetric-carebase-${{ github.sha }}
          path: artifacts/caremetric-carebase/dist/public
          if-no-files-found: error
          retention-days: 14

  database:
    needs: changes
    if: needs.changes.outputs.database == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      VITE_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-node-pnpm

      # Pin both the setup action and the CLI version. The CLI release pins the
      # service images that reproduce migration and type-generation behavior.
      - uses: ./.github/actions/setup-supabase-cli

      - name: Stop any leftover Supabase stack from a previous run
        # Warm runner VMs can retain orphaned Docker containers or stale iptables
        # NAT rules from a prior CI run, causing supabase start to fail with
        # "port 54322 already in use". Stopping first ensures a clean slate.
        run: supabase stop --no-backup 2>/dev/null || true

      - name: Start clean local Supabase stack and apply the full migration chain
        # Browser journeys need Auth, PostgREST, and the API gateway in addition
        # to Postgres. `supabase db start` starts only the database service.
        #
        # This step is also the from-scratch replay of the migration chain. The stop above
        # leaves no volume behind, so start creates an empty database, applies every file in
        # supabase/migrations in order, and fails the job on the first one that errors.
        # A `supabase db reset --no-seed` used to follow this, replaying the whole chain a
        # second time for no added coverage -- it existed only to drop the demo rows seed.sql
        # inserts. `[db.seed] enabled = false` in supabase/config.toml keeps them out of this
        # stack in the first place, so one pass is the whole story.
        run: supabase start

      - name: Database and RLS tests
        run: supabase test db

      # `--fail-on error` is not redundant with `--level error`. `--level` selects which findings
      # are PRINTED; `--fail-on` selects which findings change the EXIT CODE, and it defaults to
      # `none`. Without it this step printed lint errors and exited 0 every time -- a gate that
      # reported and never blocked. BACKLOG.md G25.1 records exactly that: `db lint --level error`
      # "had been reporting" two real errors while only `pnpm run check:database`, which does pass
      # `--fail-on error`, went red. This is the same invocation the next step already uses for
      # advisors, and the same one package.json's `check:database` uses.
      - name: Database lint
        run: supabase db lint --level error --fail-on error

      - name: Database security and performance advisors
        run: supabase db advisors --local --type all --fail-on error

      # Compares committed types against freshly generated ones, ignoring only trailing-newline
      # differences. `"$(cat f)"` strips every trailing newline and `printf '%s\n'` puts exactly
      # one back, which is what the previous Python heredoc did the long way round -- and it did it
      # by reaching for a Python interpreter this repository does not otherwise use, declare, or
      # pin anywhere in its toolchain (.node-version, deno.lock, the Supabase CLI pin).
      - name: Verify generated database types
        shell: bash
        run: |
          set -euo pipefail
          supabase gen types typescript --local > /tmp/database.types.generated.ts
          diff -u \
            <(printf '%s\n' "$(cat artifacts/caremetric-carebase/src/lib/database.types.ts)") \
            <(printf '%s\n' "$(cat /tmp/database.types.generated.ts)")

      - name: Export local Supabase browser-test environment
        shell: bash
        run: |
          eval "$(supabase status -o env)"
          echo "SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          e2e_password="phase1-e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-only"
          echo "E2E_ACCOUNT_PASSWORD=$e2e_password" >> "$GITHUB_ENV"
          echo "VITE_DEMO_ACCOUNTS_JSON=[{\"label\":\"Guest auditor\",\"email\":\"phase1-guest@test.local\",\"password\":\"$e2e_password\",\"role\":\"auditor\",\"description\":\"Review seeded compliance data and reports.\"}]" >> "$GITHUB_ENV"
          # parseDemoAccounts() drops every account from a production bundle unless
          # this is set, and the e2e suite builds with `vite build`. The demo-page
          # journey needs the accounts to render, and this bundle is a throwaway:
          # the password above is scoped to one workflow run and never deployed.
          echo "VITE_ENABLE_PUBLIC_DEMO=true" >> "$GITHUB_ENV"

      - name: Seed course-video placeholders (non-production Storage assets only)
        # See BACKLOG.md SG-3 and the script's own header. The 3 HeyGen New Employee Orientation
        # blocks only have real video files in the production project; this uploads a tiny
        # placeholder to this run's local Storage so the video-watch gate has something real to
        # resolve here, without touching the gate's logic at all. The script refuses to run
        # against anything but a loopback SUPABASE_URL, which this job's local stack always is.
        run: node scripts/seed-course-video-placeholders.mjs

      - name: Build browser-test application
        run: pnpm --filter @workspace/caremetric-carebase run build

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          # `pnpm-lock.yaml`, not `**/pnpm-lock.yaml`. This is a single-lockfile pnpm workspace, so
          # the glob never matched more at the root -- but hashFiles does not respect .gitignore,
          # and this step runs AFTER `pnpm install`, so `**` also walked node_modules and hashed
          # any lockfile a published package happens to ship. That makes the key depend on the
          # installed tree rather than on this repository, which is both slower to compute and
          # capable of missing a cache that should have hit.
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Chromium
        run: pnpm --filter @workspace/caremetric-carebase exec playwright install --with-deps chromium

      - name: Role, public, guest, and accessibility browser journeys
        run: pnpm --filter @workspace/caremetric-carebase run test:e2e

      # Playwright already writes a screenshot, video, and trace for every failure; without this they
      # are discarded with the runner. Diagnosing a browser failure from the log message alone means
      # one hypothesis per CI round -- five rounds went on a step whose screenshot would have shown
      # the answer immediately.
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failures-${{ github.sha }}
          path: |
            artifacts/caremetric-carebase/test-results
            artifacts/caremetric-carebase/playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup

  # PR-time guard for the rule the drift check enforces after the fact: a migration file
  # whose version is already on the base branch (and therefore deployed, or about to be)
  # may not be modified, deleted, or renamed. Comment-only and string-only edits fail too
  # (repo-wide find/replace is how this recurs); the escape hatch for content edits is
  # revising that version's *reason* in scripts/migration-content-allowlist.json in the
  # same PR. Renames/deletions/type-changes are never excused.
  #
  # Deliberately does NOT pass SUPABASE_ACCESS_TOKEN: this job checks out untrusted PR
  # code, and a contributor could rewrite the script to exfiltrate the token. The base
  # tree is the right deployed set here anyway — merges to main deploy automatically via
  # deploy-migrations.yml — and treating "on main" as deployed also closes the
  # merge-to-deploy lag window.
  migration-immutability:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The check diffs merge-base(base, HEAD)..HEAD, so it needs history and the
          # base branch, not just the PR merge commit. Partial clone: the check reads trees
          # (`git diff --name-status`, `git ls-tree`) plus one `git show` of the allowlist file.
          fetch-depth: 0
          filter: blob:none

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Fail if an already-deployed migration file is edited
        run: node scripts/check-migration-immutability.mjs --base "origin/${GITHUB_BASE_REF}"

  # BACKLOG.md is the single living register, and it went stale two commits after it was
  # created because "please update it in the same PR" was a convention with nothing behind
  # it. In PR mode this fails when application source, a migration, or an edge function
  # changes without the register moving too — tests, fixtures, generated types, and docs
  # are exempt, so docs-only and test-only PRs never see it. Not path-filtered: the check
  # decides for itself whether the diff is register-affecting, and it takes seconds.
  # Runs on pushes to main as well as pull requests, and that is not redundant. Gating
  # only pull requests left main unprotected twice over: this job never fired for a direct
  # push, and the tree-mode copy inside `application`'s check:all cannot help either
  # because that job checks out shallow and the freshness rule skips itself when it cannot
  # resolve the baseline commit. Four register-affecting commits reached main through that
  # gap within hours of the check landing. Here the checkout is deep, so on main the tree
  # mode runs for real and a drifted stamp turns the branch red.
  planning-registers:
    runs-on: ubuntu-latest
    # 10, not 5, because essentially all of it is clone time. The check itself runs in under a
    # second; the `fetch-depth: 0` below is a full-history clone of this repository, and on
    # 016401c that checkout took 4m59s and the 5-minute job timeout cancelled the job mid-checkout
    # -- failing the aggregate `ci-result`, and so the PR, for a reason with no connection to the
    # code. The retry cloned the same commit in 25s, which is the point: the budget was one slow
    # clone from failing on any PR. Every other full-history job here already allows more
    # (migration-immutability 10, secret-scan 15, application 25).
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # PR mode diffs merge-base(base, HEAD)..HEAD and tree mode walks baseline..HEAD;
          # both need real history, which is exactly what the shallow default cannot give.
          #
          # `filter: blob:none` is a PARTIAL clone, not a shallow one, so the check's own
          # `git rev-parse --is-shallow-repository` guard still reports false and tree mode runs
          # for real -- the whole point of this job on main. Both modes walk history with
          # `git log --name-only` and `git diff --name-only`, which need trees, not blobs.
          fetch-depth: 0
          filter: blob:none

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Fail if shipped work leaves the living backlog behind
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Did this change ship work without re-verifying the register?
            node scripts/check-planning-registers.mjs --base "origin/${GITHUB_BASE_REF}"
          else
            # Is the stamp on main still true?
            node scripts/check-planning-registers.mjs
          fi

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full clone on purpose, and the one checkout here that must NOT be `filter: blob:none`:
          # gitleaks reads the content of every historical blob, so a partial clone would refetch
          # all of them one at a time instead of once in bulk -- strictly slower, same bytes.
          fetch-depth: 0

      - name: Scan repository history for committed secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Stable required-check target when path filters skip individual jobs.
  # Treat skipped as OK; failure/cancelled of any needed job fails the gate.
  # secret-scan must always succeed (never path-skipped).
  #
  # `!cancelled()` rather than `always()`, deliberately. `always()` is true even when the RUN has
  # been cancelled, so every superseded PR run -- the concurrency block above cancels one on each
  # new push -- still reached this job, found `database: cancelled`, and reported a failed gate for
  # a commit that was no longer the head. That is a false alarm on every push-over-a-running-build,
  # and a gate that cries wolf is a gate people stop reading.
  #
  # The trade-off, stated rather than buried: on a run cancelled by a human this job is now skipped
  # instead of failing, and GitHub counts a skipped required check as passing. So a deliberate
  # cancel-then-merge is no longer blocked here. That is an intentional bypass by someone with
  # merge rights, not the accident this gate exists to catch -- and GitHub offers no way to
  # distinguish a concurrency cancellation from a manual one inside the job.
  #
  # Detection of real failures is unchanged: when the run is not cancelled this job runs exactly as
  # before, and the loop below still fails on `failure` or `cancelled` from any needed job.
  ci-result:
    if: ${{ !cancelled() }}
    needs:
      - changes
      - application
      - database
      - migration-immutability
      - planning-registers
      - secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Aggregate CI outcomes
        shell: bash
        run: |
          set -euo pipefail
          app="${{ needs.application.result }}"
          db="${{ needs.database.result }}"
          mig="${{ needs.migration-immutability.result }}"
          reg="${{ needs.planning-registers.result }}"
          sec="${{ needs.secret-scan.result }}"
          chg="${{ needs.changes.result }}"

          echo "changes=$chg application=$app database=$db migration-immutability=$mig planning-registers=$reg secret-scan=$sec"

          if [ "$chg" != "success" ]; then
            echo "::error::changes job did not succeed ($chg)"
            exit 1
          fi
          if [ "$sec" != "success" ]; then
            echo "::error::secret-scan must succeed (got $sec)"
            exit 1
          fi

          for name_and_result in "application:$app" "database:$db" "migration-immutability:$mig" "planning-registers:$reg"; do
            name="${name_and_result%%:*}"
            result="${name_and_result##*:}"
            case "$result" in
              success|skipped) ;;
              *)
                echo "::error::$name ended with $result"
                exit 1
                ;;
            esac
          done

          echo "CI path-filtered matrix OK"

name: Prepare reviewed media candidate
on:
  push:
    branches: [codex/governed-learning-media-20260911]
    paths: [.github/workflows/review-source-snapshot.yml, .github/review-apply.py]
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read the exact recovered review patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/kdeyarmin/PennTrain/issues/comments/5646535967 > /tmp/review-comment.json
      - name: Verify and apply only the reviewed patch and follow-up
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,re,subprocess
          from pathlib import Path
          comment=json.loads(Path('/tmp/review-comment.json').read_text())
          assert comment['id']==5646535967
          blocks=re.findall(r'```(?:diff|patch)\s*\n(.*?)\n```',comment['body'],re.S)
          assert len(blocks)==1
          patch=('\n'.join(blocks)+'\n').encode()
          assert hashlib.sha256(patch).hexdigest()=='72e219075f223c40389ec814c232400acc9265a258a7bc817d56235557c6870f'
          helper=Path('.github/review-apply.py').read_bytes()
          assert hashlib.sha256(helper).hexdigest()=='410856d9cc8a769ba2c0270d8860e46a0ad6b364ad8c10ad858333614bf75311'
          Path('/tmp/review.patch').write_bytes(patch)
          subprocess.run(['git','apply','--check','/tmp/review.patch'],check=True)
          subprocess.run(['git','apply','/tmp/review.patch'],check=True)
          subprocess.run(['python3','.github/review-apply.py'],check=True)
          PY
          node --experimental-strip-types --test artifacts/caremetric-carebase/server/platform-admin-media-review.test.mjs
          git add BACKLOG.md DEPLOYMENT.md artifacts/caremetric-carebase/src/components/learning/NativeCourseMediaPanel.tsx artifacts/caremetric-carebase/src/components/learning/NativeCourseMediaPanel.test.tsx artifacts/caremetric-carebase/src/lib/courseMediaHash.ts artifacts/caremetric-carebase/src/lib/courseMediaHash.test.ts artifacts/caremetric-carebase/src/pages/app/course-detail/ContentBlocksCard.tsx artifacts/caremetric-carebase/src/pages/app/course-detail/EmergencyBlockCorrection.tsx artifacts/caremetric-carebase/server/platform-admin-media-review.test.mjs artifacts/caremetric-carebase/server/platform-admin-media-database.test.mjs supabase/functions/_shared/courseMediaHttp.ts supabase/functions/_shared/courseMediaStream.ts supabase/functions/regenerate-course-block/index.ts supabase/migrations/20260911235550_immutable_course_media.sql
          git rm .github/review-apply.py .github/workflows/review-source-snapshot.yml
          git diff --cached --check
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          def git(*args):return subprocess.check_output(['git',*args]).decode().strip()
          entries=[]
          for path in git('diff','--cached','--name-only','--no-renames').splitlines():
            item={'path':path,'mode':'100644','type':'blob'}
            if not Path(path).exists():item['sha']=None
            else:item['content']=Path(path).read_text()
            entries.append(item)
          assert len(entries)==16
          Path('/tmp/review-tree.json').write_text(json.dumps({'base_tree':git('rev-parse','HEAD^{tree}'),'tree':entries}))
          Path('/tmp/review-paths.json').write_text(json.dumps([x['path'] for x in entries]))
          PY
      - name: Create candidate objects without pushing or merging
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/trees" --input /tmp/review-tree.json > /tmp/tree-result.json
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          tree=json.loads(Path('/tmp/tree-result.json').read_text())['sha']
          Path('/tmp/commit-input.json').write_text(json.dumps({'message':'fix(media): resolve identity, metadata, retry and bounded hashing reviews','tree':tree,'parents':[os.environ['GITHUB_SHA']]}))
          PY
          mkdir -p /tmp/review-candidate
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/commits" --input /tmp/commit-input.json > /tmp/review-candidate/candidate.json
          cp /tmp/review-paths.json /tmp/review-candidate/paths.json
          printf '%s\n' "$GITHUB_SHA" > /tmp/review-candidate/parent.sha
      - uses: actions/upload-artifact@v4
        with:
          name: review-patch-candidate
          path: /tmp/review-candidate/
          retention-days: 1
          if-no-files-found: error

name: Prepare reviewed media fixture correction
on:
  push:
    branches: [codex/governed-learning-media-20260911]
    paths: [.github/workflows/review-failure-evidence.yml]
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Correct only the loopback test environment name
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,subprocess
          p=Path('artifacts/caremetric-carebase/server/platform-admin-media-database.test.mjs')
          text=p.read_text();old='const serviceKey=process.env.SUPABASE_SERVICE_ROLE_KEY,anon=process.env.SUPABASE_ANON_KEY;'
          assert text.count(old)==1
          text=text.replace(old,"const serviceKey=process.env.SUPABASE_SERVICE_ROLE_KEY,anon=process.env.SUPABASE_ANON_KEY??process.env.VITE_SUPABASE_ANON_KEY;\n assert.ok(serviceKey,'Local media tests require the exported service role key');\n assert.ok(anon,'Local media tests require the exported anonymous key');")
          p.write_text(text)
          subprocess.run(['git','diff','--check'],check=True)
          base=subprocess.check_output(['git','rev-parse','HEAD^{tree}']).decode().strip()
          Path('/tmp/tree-input.json').write_text(json.dumps({'base_tree':base,'tree':[{'path':str(p),'mode':'100644','type':'blob','content':text},{'path':'.github/workflows/review-failure-evidence.yml','mode':'100644','type':'blob','sha':None}]}))
          PY
      - name: Create correction commit objects without moving refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/review-candidate
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/trees" --input /tmp/tree-input.json > /tmp/review-candidate/tree.json
          python3 - <<'PY'
          from pathlib import Path
          import json,os
          tree=json.loads(Path('/tmp/review-candidate/tree.json').read_text())['sha']
          Path('/tmp/commit-input.json').write_text(json.dumps({'message':'test(media): use the exported local anonymous key and fail fast','tree':tree,'parents':[os.environ['GITHUB_SHA']]}))
          PY
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/commits" --input /tmp/commit-input.json > /tmp/review-candidate/candidate.json
          cp /tmp/tree-input.json /tmp/review-candidate/changes.json
      - uses: actions/upload-artifact@v4
        with:
          name: review-media-fixture-candidate
          path: /tmp/review-candidate/
          retention-days: 1
          if-no-files-found: error

version: 2
updates:
  # Keep third-party Actions SHAs/tags current. Pin bumps still land as PRs
  # so review can re-verify commit SHAs before merge.
  - package-ecosystem: github-actions
    # `directories`, not `directory: /`. For the github-actions ecosystem a bare `/` covers
    # `.github/workflows` ONLY -- composite actions are found through the directory that holds
    # their `action.yml`, and `.github/actions/*` was never listed. The effect was visible in the
    # tree: every workflow pin sat on a current release while `.github/actions/setup-node-pnpm`
    # was still on `actions/setup-node` v4 and `actions/cache` v4.2.3, because nothing was
    # watching that file. The glob keeps any future composite action covered on the day it is
    # added rather than on the day someone notices.
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # One PR for the week's action bumps instead of up to ten. These pins live in
    # `.github/workflows/*` and `.github/actions/*`, which the CI path filter treats as
    # application- AND database-affecting -- so each separate bump PR booted the full matrix,
    # including the `database` job with its local Supabase stack, 681 migrations and Playwright
    # suite (about eight minutes, against a 45-minute timeout). Ten of those a week is a lot of a
    # CI budget spent re-proving the same tree against near-identical diffs. Grouped, they are
    # reviewed and validated once.
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - dependencies
      - github-actions

  # The dev container's three base images (node, denoland/deno, supabase/cli) are toolchain pins
  # like any other, and until now nothing watched them -- so the container a developer builds
  # could drift away from what CI runs without a single PR being opened. That drift is no longer
  # silent (`check:toolchain-pins` fails on it, and `.devcontainer/*` is in the CI path filter so
  # the check actually runs on these PRs).
  #
  # EVERY PR FROM THIS ECOSYSTEM ARRIVES RED, AND THAT IS THE SHAPE OF IT RATHER THAN A DEFECT.
  # All three `FROM` lines in `.devcontainer/Dockerfile` are MIRRORS of pins whose canonical copy
  # lives elsewhere -- `.node-version` for Node, `.github/workflows/ci.yml` for Deno,
  # `.github/actions/setup-supabase-cli/action.yml` for the CLI. Dependabot only ever edits the
  # Dockerfile, so it can only ever produce half a bump, and `check:toolchain-pins` is doing its
  # job when it says so. Read these PRs as PROPOSALS -- "a newer image exists" -- and never as a
  # change that is ready to merge.
  #
  # TO COMPLETE ONE, DO NOT TREAT THE CHECK'S OUTPUT AS THE WORKLIST -- it is narrower than it
  # looks. `compareMirrors` reports a mirror only when it DISAGREES with the canonical, so a
  # Dependabot PR that moved the Dockerfile alone prints one line per tool naming the Dockerfile
  # and the canonical it now contradicts. Every other mirror is still on the OLD version and
  # therefore still agrees with the canonical, so the check says nothing about it. Reproduced
  # against #503's exact diff: it named `.devcontainer/Dockerfile` and `.node-version`, and was
  # silent on `.nvmrc`, `package.json` and `AGENTS.md` -- all three of which must move too.
  # Raised by Codex on PR #506.
  #
  # The full worklist, which is the thing to actually work from:
  #   Node          -- .node-version (canonical), .nvmrc, package.json engines, AGENTS.md
  #   Deno          -- .github/workflows/ci.yml (canonical), scripts/setup-codex-cloud.sh, AGENTS.md
  #   Supabase CLI  -- .github/actions/setup-supabase-cli/action.yml (canonical), package.json,
  #                    scripts/check-database-types.mjs, AGENTS.md
  # ...plus `.devcontainer/Dockerfile` in every case, being the file Dependabot already moved. Move
  # the whole set in one PR, then re-run the check to confirm agreement.
  #
  # A MAJOR bump is a toolchain migration, not an image bump, and deserves its own reviewed PR
  # rather than a merge of Dependabot's branch -- and moving the pins is not automatically enough
  # to make one green. This repository activates pnpm with `corepack enable` in BOTH
  # `.github/actions/setup-node-pnpm/action.yml` and `.devcontainer/Dockerfile` without installing
  # it, so it depends on corepack shipping inside the Node image. That still holds through Node 26
  # -- the v25.6.0 changelog updates corepack to 0.34.6, and neither the v25 nor the v26 changelog
  # records a removal -- but it is exactly the sort of assumption a major bump can invalidate, so
  # verify it rather than inherit it. (Codex raised this on #506 believing corepack was already
  # gone as of Node 25; the premise was wrong, the caution was not.) Check
  # https://github.com/nodejs/Release as well, so the move lands LTS-to-LTS rather than onto the
  # Current line. #503 was closed on that reasoning -- the right bump, seven weeks early: Node 26
  # enters LTS 2026-10-28, and taking it in September would have put the production build on
  # Current until then.
  #
  # None of this was stated when #502 added the watcher and the check in the same pass, so the
  # first monthly PR read as a broken check rather than as an incomplete bump. BACKLOG K13.
  #
  # Monthly, not weekly: these images move slowly, and a bump here is never urgent -- the dev
  # container is not a deployment artifact. Grouped for the same reason the actions are.
  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      devcontainer-images:
        patterns:
          - "*"
    labels:
      - dependencies
      - devcontainer

# NPM IS DELIBERATELY NOT LISTED, and this is the decision rather than an omission.
#
# What would be gained: routine version bumps for ~690 locked packages arrive as PRs instead of
# being done by hand. What is already covered without it: security is handled by
# `scripts/check-dependencies.mjs`, which audits the live npm advisory database on every pull
# request and again daily against main (`dependency-advisories.yml`), and which fails on a
# high/critical a branch introduces -- Dependabot would not find those sooner. Supply-chain
# timing is handled by `minimumReleaseAge: 1440` in pnpm-workspace.yaml, which refuses any
# release under 24 hours old.
#
# What it would cost: `package.json` and `pnpm-lock.yaml` are in BOTH path-filter groups in
# ci.yml, so every npm PR boots the full matrix including the local Supabase stack and the
# Playwright suite. With one person reviewing, a queue of dependency PRs is not throughput; it is
# a queue of things to skim and merge, which is how an unreviewed lockfile change gets in.
# Version resolution is also non-trivial here: this workspace pins shared versions through a pnpm
# `catalog:`, and a bump has to move the catalog entry rather than a package's own dependency
# range for the pin to mean anything.
#
# Revisit if the daily audit starts finding advisories that a routine bump cadence would have
# stayed ahead of -- that is the evidence that would change this answer. BACKLOG K8.

name: Setup Node and pnpm
description: >
  Install Node from .node-version, activate a pinned pnpm via corepack,
  cache the pnpm store, and optionally run a frozen-lockfile install.

inputs:
  install-deps:
    description: Run `pnpm install --frozen-lockfile` after enabling pnpm
    required: false
    default: "true"
  pnpm-version:
    description: pnpm version passed to `corepack prepare`
    required: false
    default: "11.13.0"

runs:
  using: composite
  steps:
    # Same pinned SHA the workflows that do NOT use this composite already run
    # (ci.yml migration-immutability + planning-registers, dhs-source-freshness,
    # dependency-advisories). Two different setup-node pins across one repository meant two
    # Node bootstraps to keep current and two chances for them to disagree; this one was the
    # stale half, because .github/actions/* sat outside Dependabot's configured directories.
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .node-version

    - name: Enable pnpm
      shell: bash
      run: |
        corepack enable
        corepack prepare "pnpm@${{ inputs.pnpm-version }}" --activate

    - name: Get pnpm store directory
      id: pnpm-cache
      shell: bash
      run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    # Same pinned SHA ci.yml already uses for its Deno and Playwright caches.
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
        # `pnpm-lock.yaml`, not `**/pnpm-lock.yaml`: this is a single-lockfile pnpm workspace, so
        # the glob only ever added the cost of walking the tree for it -- and hashFiles ignores
        # .gitignore, so in any job where a lockfile-hashing cache step runs after an install it
        # would also hash lockfiles shipped inside node_modules packages.
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-store-${{ runner.os }}-

    - name: Install dependencies
      if: inputs.install-deps == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile

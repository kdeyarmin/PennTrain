name: Setup Supabase CLI
description: >
  Install a pinned Supabase CLI so CI and deploy use the same binary
  (and thus the same service images for migration reproduction).

inputs:
  version:
    description: Supabase CLI version
    required: false
    default: "2.109.1"

runs:
  using: composite
  steps:
    - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
      with:
        version: ${{ inputs.version }}

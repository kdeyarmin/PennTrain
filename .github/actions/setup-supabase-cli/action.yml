name: Setup Supabase CLI
description: >
  Install a pinned Supabase CLI so CI and deploy use the same binary
  (and thus the same service images for migration reproduction).

inputs:
  version:
    description: Supabase CLI version
    required: false
    default: "2.109.1"

runs:
  using: composite
  steps:
    - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
      with:
        version: ${{ inputs.version }}

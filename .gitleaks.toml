title = "CareMetric CareBase Gitleaks configuration"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Ignore the non-secret Phase 2 entitlement key used in database tests"
condition = "AND"
regexTarget = "secret"
regexes = ['''^phase2\.contract$''']
paths = ['''^supabase/tests/database/phase2_billing_integration\.test\.sql$''']

[[rules.allowlists]]
description = "Ignore the non-secret medication integration key used in database tests"
condition = "AND"
regexTarget = "secret"
regexes = ['''^abc123def456$''']
paths = ['''^supabase/tests/database/carebase_remediation_plan\.test\.sql$''']

[[rules.allowlists]]
description = "Ignore the non-secret Ohio personnel rule-pack identifier"
condition = "AND"
regexTarget = "secret"
regexes = ['''^oh\.rcf\.3701-16\.personnel$''']
paths = [
  '''^artifacts/caremetric-carebase/src/pages/admin/EnterpriseFoundation\.tsx$''',
  '''^supabase/tests/database/platform_intelligence_web_push_and_lifecycle\.test\.sql$''',
  '''^supabase/migrations/20260804020000_activation_no_longer_waits_on_a_shadow_period\.sql$''',
]

[[rules.allowlists]]
description = "Ignore the non-secret PA PCH personnel rule-pack identifier"
condition = "AND"
regexTarget = "secret"
regexes = ['''^pa\.pch\.2600\.65\.personnel$''']
paths = [
  '''^supabase/migrations/20260804020000_activation_no_longer_waits_on_a_shadow_period\.sql$''',
  '''^supabase/migrations/20260904010000_the_pa_templates_cited_the_subsections_without_the_hours\.sql$''',
  '''^supabase/tests/database/go_live_readiness_repairs\.test\.sql$''',
]

[[rules.allowlists]]
description = "Ignore the non-secret PA ALF personnel rule-pack identifier"
condition = "AND"
regexTarget = "secret"
regexes = ['''^pa\.alf\.2800\.65\.personnel$''']
paths = [
  '''^supabase/migrations/20260804020000_activation_no_longer_waits_on_a_shadow_period\.sql$''',
  '''^supabase/migrations/20260810110000_the_alr_sweep_matched_only_the_prefix\.sql$''',
  '''^supabase/migrations/20260904010000_the_pa_templates_cited_the_subsections_without_the_hours\.sql$''',
  '''^supabase/tests/database/go_live_readiness_repairs\.test\.sql$''',
]

[[rules.allowlists]]
description = "Ignore the non-secret incident pathway question key (a template field name, not a credential)"
condition = "AND"
regexTarget = "secret"
regexes = ['''^prior_falls_90_days$''']
paths = [
  '''^artifacts/caremetric-carebase/src/lib/incidentPathways\.ts$''',
  '''^artifacts/caremetric-carebase/src/lib/incidentPathways\.test\.ts$''',
]

[[rules.allowlists]]
description = "Ignore the non-secret I33 feature keys used in the retired-feature database test"
condition = "AND"
regexTarget = "secret"
regexes = ['''^sg9\.(other_live|retired_probe)$''']
paths = ['''^supabase/tests/database/retired_feature_cannot_be_sold\.test\.sql$''']
